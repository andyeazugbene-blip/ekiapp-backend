name: Automation Scheduler

# GitHub scheduled runs are best effort; this is not a real-time SLA. The
# repository owner must configure CRON_SECRET to match the backend's existing
# Vercel value and verify successful scheduled runs before cadence gates can be
# enabled. Never print or change either secret here.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-time-sensitive-jobs:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://ekiapp-backend.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the authenticated scheduler secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is unavailable to the scheduled workflow; internal jobs were not run"
            exit 1
          fi

      - name: Automation sweep (cart recovery, low-stock alerts, onboarding nudges, win-back, referrals, reorder/checkout reminders)
        run: node scripts/call-internal-scheduler-endpoint.mjs automation-sweep /api/internal/jobs/automation-sweep

      - name: Scheduled communications (admin Schedule Later broadcasts + push receipt refresh)
        run: node scripts/call-internal-scheduler-endpoint.mjs run-scheduled-communications /api/internal/jobs/run-scheduled-communications

      - name: Unacknowledged order reminders
        run: node scripts/call-internal-scheduler-endpoint.mjs order-unacknowledged-sweep /api/internal/jobs/order-unacknowledged-sweep

      - name: Dispatch-due reminders
        run: node scripts/call-internal-scheduler-endpoint.mjs order-dispatch-due-sweep /api/internal/jobs/order-dispatch-due-sweep

      - name: Community Buy stuck-capture review alert
        run: node scripts/call-internal-scheduler-endpoint.mjs community-buy-capture-pending-review-sweep /api/internal/jobs/community-buy-capture-pending-review-sweep
